name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      # repository secrets; the bundle steps are skipped while they are not set
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # pyspark 4 needs Java 17 or later for the local Spark tests of the document rules
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: ruff lint
        run: uvx ruff@0.17.6 check .
      - name: ruff format
        run: uvx ruff@0.17.6 format --check .
      - name: unit tests
        run: uv run --no-project --with pytest --with requests --with databricks-sdk==0.171.0 --with sqlglot==30.35.0 --with pyspark==4.0.1 pytest -q tests
      - name: dashboard JSON matches its generator
        run: python3 dashboards/build_dashboard.py && git diff --exit-code dashboards/
      - name: Genie space JSON matches its generator
        run: python3 genie/build_genie_space.py && git diff --exit-code genie/
      - name: install Databricks CLI
        if: ${{ env.DATABRICKS_TOKEN != '' }}
        uses: databricks/setup-cli@v1.26.0
      - name: bundle validate
        if: ${{ env.DATABRICKS_TOKEN != '' }}
        run: databricks bundle validate -t prod
