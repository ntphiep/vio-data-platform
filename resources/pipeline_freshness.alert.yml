resources:
  alerts:
    # Dead-man switch: the job writes end-to-end checks every hour. If none arrived for 150 minutes, the job
    # is not running at all (paused, quota shut down, deploy broken), which no task inside the job can report.
    pipeline_freshness:
      display_name: Vio Travel pipeline freshness
      warehouse_id: ${var.warehouse_id}
      query_text: >-
        SELECT coalesce(timestampdiff(MINUTE, max(checked_at), current_timestamp()), 99999) AS minutes_since_last_check
        FROM ${var.catalog}.ops.dq_results WHERE check_name LIKE 'e2e_%'
      evaluation:
        source:
          name: minutes_since_last_check
        comparison_operator: GREATER_THAN
        threshold:
          value:
            double_value: 150
        empty_result_state: TRIGGERED
        notification:
          notify_on_ok: true
          subscriptions:
            - user_email: ${workspace.current_user.userName}
      schedule:
        # minute 25: inside the 10 minutes the warehouse stays up after the push that follows the run at minute 05,
        # so the alert does not start the warehouse on its own (Free Edition cannot change auto stop)
        quartz_cron_schedule: "0 25 * * * ?"
        timezone_id: Asia/Ho_Chi_Minh
