resources:
  schemas:
    raw:
      catalog_name: ${var.catalog}
      name: raw
      comment: Landing volume with Travel Compositor API responses as gzip NDJSON. Contains personal data.
      lifecycle: {prevent_destroy: true}
    bronze:
      catalog_name: ${var.catalog}
      name: bronze
      comment: Append-only copy of every landed record as VARIANT (Auto Loader in pipeline vio_travel_build_bronze_silver_gold). Contains personal data.
      lifecycle: {prevent_destroy: true}
    silver:
      catalog_name: ${var.catalog}
      name: silver
      comment: Current state and SCD type 2 history of bookings, agencies, suppliers, users, travel ideas, payments and accommodations. Contains personal data.
      lifecycle: {prevent_destroy: true}
    gold:
      catalog_name: ${var.catalog}
      name: gold
      comment: Analytics model - star schema (dim_*, fact_*), one big table obt_booking_service and metric views (*_metrics).
    business_central:
      catalog_name: ${var.catalog}
      name: business_central
      comment: Integration output shaped for the Business Central API; read by task push_to_business_central. Rebuilt each run.
    ref:
      catalog_name: ${var.catalog}
      name: ref
      comment: Mapping tables maintained by Vio Finance (umbrella agency, customer map, vendor map).
      lifecycle: {prevent_destroy: true}
    governance:
      catalog_name: ${var.catalog}
      name: governance
      comment: Masking function mask_pii and other governance helpers.
      lifecycle: {prevent_destroy: true}
    ops:
      catalog_name: ${var.catalog}
      name: ops
      comment: Run logs, watermark, pipeline event log, data-quality results, publish versions, Business Central sync log.
      lifecycle: {prevent_destroy: true}

  volumes:
    landing:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.raw.name}
      name: landing
      volume_type: MANAGED
      comment: One folder per entity, ingest_date and run; files older than 90 days are removed by extract_travel_compositor.
      lifecycle: {prevent_destroy: true}
