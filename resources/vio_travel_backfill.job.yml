resources:
  jobs:
    # Re-extract a long date range in parallel, month by month, without moving the watermark of the regular job,
    # then refresh the pipeline once. AUTO CDC orders versions by lastUpdateDate, so the order in which the
    # windows land does not matter.
    vio_travel_backfill:
      name: vio_travel_backfill
      description: >-
        Backfill of bookings: plan_windows splits [backfill_from, backfill_to] into calendar months, extract_window
        runs extract_tc for each month (for-each task, 3 at a time), then the pipeline vio_travel_lakehouse,
        bc_tables and data_quality run once.
      max_concurrent_runs: 1
      timeout_seconds: 21600
      run_as:
        service_principal_name: ${var.pipeline_sp}
      email_notifications:
        on_failure: [ "${workspace.current_user.userName}" ]
      tags:
        project: vio_travel
        contains_pii: "true"
      parameters:
        - name: backfill_from
          default: "2015-01-01"
        - name: backfill_to
          default: ""
        - name: months
          default: "1"
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - requests
      tasks:
        - task_key: plan_windows
          environment_key: default
          spark_python_task:
            python_file: ../src/plan_backfill.py
            parameters: ["--backfill_from", "{{job.parameters.backfill_from}}",
                         "--backfill_to", "{{job.parameters.backfill_to}}", "--months", "{{job.parameters.months}}"]
        - task_key: extract_window
          depends_on:
            - task_key: plan_windows
          for_each_task:
            inputs: "{{tasks.plan_windows.values.windows}}"
            concurrency: 3        # Free Edition runs at most 5 tasks at once
            task:
              task_key: extract_window_iteration
              environment_key: default
              max_retries: 2
              min_retry_interval_millis: 120000
              spark_python_task:
                python_file: ../src/ingest_tc.py
                parameters: ["--catalog", "${var.catalog}", "--entities", "bookings",
                             "--backfill_from", "{{input.from}}", "--backfill_to", "{{input.to}}"]
        - task_key: lakehouse
          depends_on:
            - task_key: extract_window
          pipeline_task:
            pipeline_id: ${resources.pipelines.vio_travel_lakehouse.id}
        - task_key: bc_tables
          depends_on:
            - task_key: lakehouse
          environment_key: default
          spark_python_task:
            python_file: ../src/bc_tables.py
            parameters: ["--catalog", "${var.catalog}", "--run_id", "{{job.run_id}}"]
        - task_key: data_quality
          depends_on:
            - task_key: bc_tables
          run_if: ALL_DONE
          environment_key: default
          spark_python_task:
            python_file: ../src/data_quality.py
            parameters: ["--catalog", "${var.catalog}", "--run_id", "{{job.run_id}}"]
