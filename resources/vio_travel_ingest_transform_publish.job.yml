resources:
  jobs:
    vio_travel_ingest_transform_publish:
      name: vio_travel_ingest_transform_publish
      description: >-
        Travel Compositor API -> volume raw.landing (extract_travel_compositor) -> pipeline vio_travel_build_bronze_silver_gold (bronze, silver
        with history, gold star schema read by the dashboard vio_travel_overview and the Genie space) -> Business
        Central integration tables in business_central (build_business_central_tables, published only after its blocking checks pass)
        -> draft invoices in Business Central (push_to_business_central, signed in with the delegated refresh token in
        secret scope vio-business-central); in parallel, posted sales and purchase documents per booking version in
        the shape of the implementation partner specification (build_business_central_documents, not pushed yet).
        The last task, check_data_quality, records pipeline expectations, gold checks and end-to-end freshness.
      max_concurrent_runs: 1
      run_as:
        service_principal_name: ${var.pipeline_sp}
      timeout_seconds: 2700       # a run takes about 7 minutes; 45 minutes stops a hung run before the next hourly start
      queue: {enabled: true}
      schedule:
        # every hour at minute 05. Every 30 minutes used up the Free Edition daily compute quota by about 14:00, after
        # which no job, pipeline or warehouse could start until the quota reset. The pipeline refreshes only what
        # changed and build_business_central_tables skips the rebuild when silver did not change.
        quartz_cron_expression: "0 5 * * * ?"
        timezone_id: Asia/Ho_Chi_Minh
        pause_status: UNPAUSED
      health:
        rules:
          - metric: RUN_DURATION_SECONDS
            op: GREATER_THAN
            value: 1800
      email_notifications:
        on_failure: [ "${workspace.current_user.userName}" ]
        on_duration_warning_threshold_exceeded: [ "${workspace.current_user.userName}" ]
      tags:
        project: vio_travel
        data_classification: personal_data
      parameters:
        - name: backfill_from
          default: ""
        - name: rebuild
          default: "false"
        # results that push_to_business_central sends again although the payload did not change, e.g. FAILED
        - name: push_retry
          default: ""
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - requests
        # environment version 2 ships databricks-sdk 0.40.0 and no msal
        - environment_key: push_to_business_central
          spec:
            environment_version: "2"
            dependencies:
              - msal==1.39.0
              - databricks-sdk==0.171.0
              - requests==2.34.2
      tasks:
        - task_key: extract_travel_compositor
          environment_key: default
          max_retries: 2
          min_retry_interval_millis: 300000
          spark_python_task:
            python_file: ../src/extract_travel_compositor.py
            parameters: ["--catalog", "${var.catalog}", "--backfill_from", "{{job.parameters.backfill_from}}"]
        - task_key: build_bronze_silver_gold
          depends_on:
            - task_key: extract_travel_compositor
          # no task retry: the pipeline retries the update itself (pipelines.numUpdateRetryAttempts)
          max_retries: 0
          pipeline_task:
            pipeline_id: ${resources.pipelines.vio_travel_build_bronze_silver_gold.id}
            full_refresh: false
        - task_key: build_business_central_tables
          depends_on:
            - task_key: build_bronze_silver_gold
          environment_key: default
          max_retries: 1
          spark_python_task:
            python_file: ../src/build_business_central_tables.py
            parameters: ["--catalog", "${var.catalog}", "--run_id", "{{job.run_id}}",
                         "--rebuild", "{{job.parameters.rebuild}}"]
        # Runs only after build_business_central_tables succeeded, and reads the tables AS OF the versions it published
        # in ops.publish. No retry: a POST that failed may have been committed, and the next hourly run finds the
        # document by its key; a refused refresh token fails the same way on a retry.
        - task_key: push_to_business_central
          depends_on:
            - task_key: build_business_central_tables
          environment_key: push_to_business_central
          max_retries: 0
          spark_python_task:
            python_file: ../src/push_to_business_central.py
            parameters: ["--catalog", "${var.catalog}", "--run_id", "{{job.run_id}}",
                         "--config", "${workspace.file_path}/src/push_to_business_central.json",
                         "--retry", "{{job.parameters.push_retry}}"]
        # Not part of the write-audit-publish of build_business_central_tables: push_to_business_central does not read
        # these tables, so their blocking checks fail this task only. ALL_DONE: the documents are built from
        # bronze, which a failed draft-invoice build leaves as it is. No retry: the documents are append-only, so a
        # retry after a blocking check reads the same bookings and fails the same way; the next hourly run reads them
        # again.
        - task_key: build_business_central_documents
          depends_on:
            - task_key: build_business_central_tables
          run_if: ALL_DONE
          environment_key: default
          max_retries: 0
          spark_python_task:
            python_file: ../src/build_business_central_documents.py
            parameters: ["--catalog", "${var.catalog}", "--run_id", "{{job.run_id}}",
                         "--rebuild", "{{job.parameters.rebuild}}"]
        - task_key: check_data_quality
          depends_on:
            - task_key: build_business_central_documents
            - task_key: push_to_business_central
          run_if: ALL_DONE          # also after a failed task, so the end-to-end state is always recorded
          environment_key: default
          spark_python_task:
            python_file: ../src/check_data_quality.py
            parameters: ["--catalog", "${var.catalog}", "--run_id", "{{job.run_id}}"]
